kind = "web"
previewPath = "/"
title = "c-bun"
description = "A c-bun Angular app with routing, a live preview, and a guide to the workspace."
version = "1.0.0"
id = "artifacts/angular-starter"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20549

[services.development]
run = "pnpm --filter @workspace/c-bun run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/c-bun", "run", "build" ]
serve = "static"
publicDir = "artifacts/angular-starter/dist/public/browser"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20549"
BASE_PATH = "/"
